spring:
  application:
    name: razorpay
  datasource:
    url: jdbc:postgresql://localhost:5432/${PSQL_DATABASE}
    username: ${PSQL_USER}
    password: ${PSQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  master-key: ${MASTER_KEY}

  payment:
    simulator:
      poll-intercal-ms: 5000
      chaos-mode: NORMAL
      method:
        CARD:
          min-delay-seconds: 2
          max-delay-second: 6
          success-rate: 90
        UPI:
            min-delay-seconds: 1
            max-delay-second: 3
            success-rate: 95
        NET-BANKING:
          min-delay-seconds: 4
          max-delay-second: 10
          success-rate: 80
jwt:
  secret-key: ${JWT_SECRET}

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2
