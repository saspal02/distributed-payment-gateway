apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: paygrid-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: paygrid-local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka.paygrid-core.svc.cluster.local:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: paygrid-core
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8090
      targetPort: 8080
