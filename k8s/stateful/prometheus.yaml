apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: paygrid-core
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: api-gateway-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["api-gateway:80"]

      - job_name: merchant-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["merchant-service:80"]

      - job_name: payment-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["payment-service:80"]

      - job_name: operations-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["operations-service:80"]

      - job_name: vault-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["vault-service:80"]

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: paygrid-core
spec:
  selector:
    matchLabels:
      app: prometheus
  serviceName: prometheus
  replicas: 1
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: paygrid-core
spec:
  clusterIP: None
  selector:
    app: prometheus
  ports:
    - port: 9090
